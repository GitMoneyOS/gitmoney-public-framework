name: Evidence Gate & Architecture Verification

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Copy Rails (No Emojis, No Em-Dashes)
        run: |
          echo "Scanning markdown files for copy rail violations..."
          EM_DASHES=$(grep -rn "—" docs/ README.md CONTRIBUTING.md starter/ templates/ 2>/dev/null || true)
          if [ -n "$EM_DASHES" ]; then
            echo "ERROR: Em-dashes detected! Use hyphens (-), colons (:), or parentheses instead."
            echo "$EM_DASHES"
            exit 1
          fi
          echo "Copy rails check passed: 0 em-dashes found."

      - name: Check Frontmatter Metadata in Proof Docs
        run: |
          echo "Verifying frontmatter metadata in proof package..."
          for file in docs/proof-package/*.md; do
            if [ -f "$file" ]; then
              if ! grep -qi "Purpose" "$file" && ! grep -qi "owner" "$file"; then
                echo "WARNING: $file missing explicit Purpose or Owner metadata."
              fi
            fi
          done
          echo "Frontmatter check completed."

      - name: Run GitMoney Architecture Doctor
        run: |
          echo "Running GitMoney Doctor..."
          node scripts/gitmoney.mjs doctor

      - name: Run Conformance & Negative Fixture Suite
        run: |
          echo "Running Conformance Suite..."
          node tests/conformance.mjs
